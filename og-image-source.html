<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,400&family=Archivo:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body{
    width:1200px; height:630px;
    background:#0E1B20;
    font-family:'IBM Plex Mono', monospace;
    position:relative;
    overflow:hidden;
  }
  .grid{
    position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(232,230,214,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(232,230,214,.05) 1px, transparent 1px);
    background-size:60px 60px;
  }
  .content{
    position:relative; z-index:1;
    padding:88px 90px;
    height:100%;
    display:flex; flex-direction:column; justify-content:space-between;
  }
  .eyebrow{
    font-size:16px; letter-spacing:.16em; text-transform:uppercase; color:#5C9873;
  }
  .name{
    font-family:'Fraunces', serif; font-weight:400; font-size:96px; color:#EFEADA;
    line-height:1; letter-spacing:-.01em; margin-top:22px;
  }
  .line{
    font-family:'Archivo', 'IBM Plex Mono', sans-serif; font-size:26px; color:rgba(239,234,218,.72);
    margin-top:26px; max-width:820px; line-height:1.5;
  }
  svg{ display:block; }
  .foot{ display:flex; justify-content:space-between; align-items:flex-end; }
  .foot-label{ font-size:14px; letter-spacing:.08em; color:rgba(239,234,218,.4); text-transform:uppercase; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="content">
    <div>
      <div class="eyebrow">ANALYTICS DIRECTOR — BEVERAGE &amp; CPG</div>
      <div class="name">Matthew Schmidt</div>
      <div class="line">Turning data into decisions. Turning ideas into things people can use.</div>
    </div>
    <div class="foot">
      <svg width="420" height="60" viewBox="0 0 420 60">
        <path d="M0,30 L30,30 L45,30 L60,12 L75,48 L90,30 L105,30 L120,18 L135,42 L150,30 L165,30 L420,30"
          fill="none" stroke="#5C9873" stroke-width="2"/>
      </svg>
      <div class="foot-label">Signal &amp; Stillness</div>
    </div>
  </div>
</body>
</html>
