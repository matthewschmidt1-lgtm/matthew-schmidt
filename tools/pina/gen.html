      return { q: pc.q, tx: +(CX + dx).toFixed(2), ty: +(CY + dy).toFixed(2), rot: +(pc.rot * ease).toFixed(2), cx: +pc.cx.toFixed(1), cy: +pc.cy.toFixed(1) };
    }));
  });
  pieces.forEach(function (pc) { pc.pc.setAttribute('transform', 'translate(' + CX + ' ' + CY + ')'); pc.shadow.setAttribute('data-shadow', '1'); });
  whole.setAttribute('data-whole', '1'); ground.setAttribute('data-ground', '1'); ground.setAttribute('opacity', '0');
  closedShadow.setAttribute('data-closed-shadow', '1'); cross.remove();
  var out = document.createElement('pre'); out.id = 'out';
  out.textContent = JSON.stringify({ samples: samples, svg: svg.innerHTML });
  document.body.appendChild(out);
})();
</script>
