<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Option K: Drum</title><style>*{box-sizing:border-box;margin:0}body{font-family:Georgia,serif;min-height:100vh;overflow-x:hidden}h1{font-weight:400;text-align:center;font-size:clamp(28px,4vw,44px)}img{display:block;width:100%}
body{background:#0e1116;color:#f1efe8;padding:56px 0;overflow:hidden}
.scene{perspective:1400px;height:420px;margin-top:30px}
.drum{position:relative;width:200px;height:260px;margin:60px auto 0;transform-style:preserve-3d;animation:spin 36s linear infinite}
.scene:hover .drum{animation-play-state:paused}
.fc{position:absolute;inset:0;transform:rotateY(var(--r)) translateZ(330px);text-align:center;backface-visibility:hidden}
.fc img{box-shadow:0 0 40px #7ff2ff22}.fc h3{font-weight:400;font-size:17px;margin-top:10px}
@keyframes spin{to{transform:rotateY(-360deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style><h1>Things I’ve Built</h1><div class="scene"><div class="drum"><div class="fc" style="--r:0deg"><img src="friction.png" alt="Friction" style="border-radius:16px"><h3>Friction</h3></div><div class="fc" style="--r:60deg"><img src="decision.png" alt="Decision OS" style="border-radius:16px"><h3>Decision OS</h3></div><div class="fc" style="--r:120deg"><img src="atlas.png" alt="Algorithm Atlas" style="border-radius:16px"><h3>Algorithm Atlas</h3></div><div class="fc" style="--r:180deg"><img src="stillward.png" alt="Stillward" style="border-radius:34px"><h3>Stillward</h3></div><div class="fc" style="--r:240deg"><img src="water.png" alt="Water" style="border-radius:16px"><h3>Water</h3></div><div class="fc" style="--r:300deg"><img src="nightnight.png" alt="Night Night" style="border-radius:16px"><h3>Night Night</h3></div></div></div>
