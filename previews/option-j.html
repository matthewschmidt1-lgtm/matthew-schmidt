<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Option J: Constellation</title><style>*{box-sizing:border-box;margin:0}body{font-family:Georgia,serif;min-height:100vh;overflow-x:hidden}h1{font-weight:400;text-align:center;font-size:clamp(28px,4vw,44px)}img{display:block;width:100%}
body{background:radial-gradient(#1b2349,#070b1a);height:100vh;overflow:hidden;color:#f5f5f7}
h1{position:absolute;top:28px;left:0;right:0;z-index:5}
.sky{position:absolute;inset:0}
svg{position:absolute;inset:0;width:100%;height:100%}
line{stroke:#9cd870;stroke-opacity:.35;stroke-width:1;stroke-dasharray:3 6;animation:dash 6s linear infinite}
@keyframes dash{to{stroke-dashoffset:-90}}
.w{position:absolute;width:150px;margin:-60px 0 0 -75px;transform:translate(calc(var(--mx,0)*var(--z)*30px),calc(var(--my,0)*var(--z)*30px)) scale(calc(.8 + var(--z)*.25));transition:transform .3s}
.in{animation:bob 7s ease-in-out infinite;animation-delay:var(--d);text-align:center}
.in img{box-shadow:0 0 40px #9cd87033,0 10px 30px #0008;transition:.4s}.in:hover img{box-shadow:0 0 60px #f4bc4a99}
.in h3{font-weight:400;font-size:15px;margin-top:8px}
@keyframes bob{50%{transform:translateY(-10px)}}
.st{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;animation:tw 3s infinite}@keyframes tw{50%{opacity:.1}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style><h1>Things I’ve Built</h1><div class="sky" id="sky"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><line x1="50" y1="18" x2="80" y2="40"/><line x1="80" y1="40" x2="70" y2="75"/><line x1="70" y1="75" x2="30" y2="75"/><line x1="30" y1="75" x2="20" y2="40"/><line x1="20" y1="40" x2="50" y2="18"/><line x1="50" y1="18" x2="50" y2="50"/><line x1="80" y1="40" x2="50" y2="50"/><line x1="70" y1="75" x2="50" y2="50"/><line x1="30" y1="75" x2="50" y2="50"/><line x1="20" y1="40" x2="50" y2="50"/></svg><div class="w" style="left:50%;top:18%;--z:0.5;--d:-0.0s"><div class="in"><img src="friction.png" alt="Friction" style="border-radius:16px"><h3>Friction</h3></div></div><div class="w" style="left:80%;top:40%;--z:0.95;--d:-1.3s"><div class="in"><img src="decision.png" alt="Decision OS" style="border-radius:16px"><h3>Decision OS</h3></div></div><div class="w" style="left:70%;top:75%;--z:1.4;--d:-2.6s"><div class="in"><img src="atlas.png" alt="Algorithm Atlas" style="border-radius:16px"><h3>Algorithm Atlas</h3></div></div><div class="w" style="left:30%;top:75%;--z:0.5;--d:-3.9000000000000004s"><div class="in"><img src="stillward.png" alt="Stillward" style="border-radius:34px"><h3>Stillward</h3></div></div><div class="w" style="left:20%;top:40%;--z:0.95;--d:-5.2s"><div class="in"><img src="water.png" alt="Water" style="border-radius:16px"><h3>Water</h3></div></div><div class="w" style="left:50%;top:50%;--z:1.4;--d:-6.5s"><div class="in"><img src="nightnight.png" alt="Night Night" style="border-radius:16px"><h3>Night Night</h3></div></div></div><script>const k=document.getElementById("sky");for(let i=0;i<60;i++){const s=document.createElement("i");s.className="st";s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${Math.random()*3}s`;k.prepend(s)}addEventListener("mousemove",e=>{k.style.setProperty("--mx",e.clientX/innerWidth-.5);k.style.setProperty("--my",e.clientY/innerHeight-.5)})</script>
