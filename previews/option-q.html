<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Option Q: Turntable</title>
<style>
*{box-sizing:border-box;margin:0}
body{font-family:Georgia,serif;background:#0f0d0b;color:#f1e8d4;min-height:100vh;padding:40px 0;overflow-x:hidden}
h1{font-weight:400;text-align:center;font-size:clamp(28px,4vw,44px);margin-bottom:24px}
.fit{display:flex;justify-content:center}
.st{position:relative;width:900px;height:650px;flex:none;border-radius:28px;background:radial-gradient(ellipse at 70% 40%,#2a231b,#14110e 70%);box-shadow:0 30px 60px #000a;overflow:hidden}
/* preview frame, left */
.scr{position:absolute;left:40px;top:92px;width:372px;height:372px;border-radius:20px;background:#050505;border:10px solid #1d1a16;box-shadow:0 0 0 2px #3a3328,0 0 60px #f4bc4a22,inset 0 0 30px #000;overflow:hidden}
.scr img{position:absolute;left:50%;top:50%;width:300px;max-height:340px;width:auto;max-width:340px;transform:translate(-50%,-50%) scale(.96);opacity:0;transition:opacity .8s,transform 6s linear;object-fit:contain}
.scr img.on{opacity:1;transform:translate(-50%,-50%) scale(1.03)}
.scr::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(transparent 0 2px,#0000000d 2px 3px);pointer-events:none}
.cap{position:absolute;left:40px;top:478px;width:392px;transition:opacity .8s;opacity:0}
.cap.on{opacity:1}
.cap small{font:11px monospace;letter-spacing:.25em;color:#f08a3e;display:flex;align-items:flex-end;gap:10px}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:12px}.eq i{width:3px;background:#f08a3e;animation:eq .7s ease-in-out infinite alternate}
.eq i:nth-child(2){animation-delay:-.2s}.eq i:nth-child(3){animation-delay:-.4s}.eq i:nth-child(4){animation-delay:-.1s}
@keyframes eq{from{height:3px}to{height:12px}}
.cap h3{font-weight:400;font-style:italic;font-size:26px;margin-top:8px}.cap p{font-size:14px;color:#c9bfa6;margin-top:4px}
.cap .ds{font-size:15px;line-height:1.35;color:#f1e8d4;margin-top:10px;padding-left:12px;border-left:2px solid #f08a3e;opacity:0;transform:translateY(6px);transition:opacity 1s,transform 1s}
.cap.more .ds{opacity:1;transform:none}
/* deck */
.deck{position:absolute;left:470px;top:30px;width:400px;height:420px;border-radius:18px;background:linear-gradient(145deg,#2c2924,#16140f);box-shadow:inset 0 0 0 1px #4a443a,0 14px 30px #000a}
.deck::after{content:"33  45";position:absolute;left:22px;bottom:16px;font:10px monospace;letter-spacing:.3em;color:#6e6759}
.led{position:absolute;left:24px;top:24px;width:10px;height:10px;border-radius:50%;background:#3a1a14;transition:.4s}.led.on{background:#5dff8a;box-shadow:0 0 10px #5dff8a}
.fad{position:absolute;right:24px;bottom:30px;width:6px;height:90px;background:#0a0908;border-radius:3px}.fad i{position:absolute;left:-9px;top:52px;width:24px;height:12px;background:#d9d4c6;border-radius:2px}
.pl{position:absolute;left:500px;top:100px;width:300px;height:300px;border-radius:50%;background:radial-gradient(#d4d1c8,#8d8a82);box-shadow:0 6px 16px #000b,inset 0 0 0 5px #77746c}
.pl::before{content:"";position:absolute;inset:3px;border-radius:50%;background:repeating-conic-gradient(#111 0 1deg,#d4d1c8 1deg 4deg);opacity:.5;-webkit-mask:radial-gradient(transparent 94%,#000 95%);mask:radial-gradient(transparent 94%,#000 95%)}
.rec{position:absolute;left:510px;top:110px;width:280px;height:280px;z-index:4;opacity:0;filter:drop-shadow(0 6px 8px #000a)}
.dc{position:absolute;inset:0;border-radius:50%;background:radial-gradient(#0000 0 34%,#0000 34%),repeating-radial-gradient(#0d0d0d 0 2px,#1c1c1c 2px 3px);display:flex;align-items:center;justify-content:center}
.lb{width:96px;height:96px;border-radius:50%;background:var(--c,#f08a3e);display:flex;align-items:center;justify-content:center;text-align:center;font:600 10px/1.2 Georgia;color:#1a1208;box-shadow:inset 0 0 0 4px #00000022;position:relative}
.lb::after{content:"";position:absolute;width:7px;height:7px;border-radius:50%;background:#14110e}
.lb span{position:relative;top:-18px;max-width:70px}
.sh{position:absolute;inset:0;border-radius:50%;background:conic-gradient(#fff0 0 8%,#ffffff2e 12%,#fff0 18% 50%,#ffffff22 62%,#fff0 70%);pointer-events:none}
.arm{position:absolute;left:520px;top:76px;width:330px;height:8px;transform-origin:100% 50%;z-index:8;transition:filter .5s}
.arm b{position:absolute;inset:0;border-radius:4px;background:linear-gradient(#f2f0ea,#8a877e)}
.arm u{position:absolute;left:-6px;top:-4px;width:34px;height:16px;border-radius:3px;background:#0c0c0c;box-shadow:0 3px 5px #0009}
.arm s{position:absolute;right:-14px;top:-10px;width:28px;height:28px;border-radius:50%;background:#1a1816;box-shadow:inset 0 0 0 3px #3a3631}
.base{position:absolute;left:826px;top:56px;width:48px;height:48px;border-radius:50%;background:radial-gradient(#4a463f,#1d1b17);z-index:7;box-shadow:0 3px 6px #000a}
/* crate */
.sv{position:absolute;top:484px;width:60px;height:60px;border:3px solid #f1e8d4;border-radius:3px;background-size:cover;background-position:top;z-index:5;transition:transform .5s}
.crate{position:absolute;left:470px;top:530px;width:400px;height:70px;z-index:7;border-radius:6px 6px 12px 12px;background:repeating-linear-gradient(90deg,#7a5230 0 14px,#6c4727 14px 15px);box-shadow:inset 0 3px 0 #a17848,0 8px 16px #000a}
</style>
<h1>Things I’ve Built</h1>
<div class="fit"><div class="st" id="st">
 <div class="scr" id="scr"></div>
 <div class="cap" id="cap"><small>NOW PLAYING <span class="eq"><i></i><i></i><i></i><i></i></span></small><h3></h3><p></p><div class="ds"></div></div>
 <div class="deck"><div class="led" id="led"></div><div class="fad"><i></i></div></div>
 <div class="pl"></div>
 <div class="rec" id="rec"><div class="dc" id="dc"><div class="lb" id="lb"><span></span></div></div><div class="sh"></div></div>
 <div class="base"></div>
 <div class="arm" id="arm"><b></b><u></u><s></s></div>
 <div id="sv"></div><div class="crate"></div>
</div></div>
<script>
const P=[['friction','Friction','Find where the organization gets stuck.','#f08a3e','A guided diagnosis of the gaps between Business, Systems, and People. A dozen questions, about three minutes, no score.'],['decision','Decision OS','Sharper commercial judgment, one decision at a time.','#5b82e8','Practice the decisions that drive CPG sales, from winning distribution to improving promotions and growing retailer partnerships.'],['atlas','Algorithm Atlas','A field guide to the algorithms behind AI.','#9aa88c','Understand how algorithms work, experiment with their logic, and explore the mathematics beneath them.'],['stillward','Stillward','Three minutes. No pressure.','#d8c6a5','A three-minute practice. Pick a teacher, breathe, return. No streaks, no account, no pressure.'],['water','Water','It’s always going somewhere.','#2fb8c6','Follow the Flow.'],['nightnight','Night Night','A tree that grows, glows, and lets go.','#f4bc4a','Watch a season pass under a slow turn of stars.']];
const $=id=>document.getElementById(id),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const scr=$('scr'),cap=$('cap'),rec=$('rec'),dc=$('dc'),arm=$('arm'),led=$('led'),lb=$('lb');
const sx=i=>500+i*64;
P.forEach(([k,t],i)=>{scr.insertAdjacentHTML('beforeend',`<img src="${k}.png" alt="${t}">`);
 $('sv').insertAdjacentHTML('beforeend',`<div class="sv" style="left:${sx(i)-30}px;background-image:url(${k}.png)"></div>`)});
const imgs=[...scr.children],svs=[...$('sv').children];
const tf=(x,y,s,r)=>`translate(${x-650}px,${y-250}px) scale(${s}) rotate(${r}deg)`;
async function run(el,frames,dur,end,ease='cubic-bezier(.45,.05,.3,1)'){const a=el.animate(frames,{duration:dur,easing:ease,fill:'forwards'});await a.finished;el.style.transform=end;a.cancel()}
async function track(i){
 const x=sx(i),sv=svs[i],[,t,q,c,d]=P[i];
 lb.style.setProperty('--c',c);lb.firstChild.textContent=t;
 rec.style.opacity=1;rec.style.transform=tf(x,525,.21,0);
 await sleep(300);
 // slide up out of the sleeve, then carry to the platter
 await run(rec,[{transform:tf(x,525,.21,0)},{transform:tf(x,440,.21,0),offset:.2},{transform:tf((x+650)/2,330,.6,100),offset:.62},{transform:tf(650,250,1.06,300)},{transform:tf(650,250,1,360)}],1500,tf(650,250,1,0));
 sv.style.transform='translateY(16px)';
 // spin up, lower the needle
 const spin=dc.animate([{transform:'rotate(0)'},{transform:'rotate(360deg)'}],{duration:1800,iterations:Infinity});
 spin.playbackRate=.1;led.classList.add('on');
 for(let r=.1;r<1;r+=.15){spin.playbackRate=r;await sleep(90)}spin.playbackRate=1;
 await run(arm,[{transform:'rotate(0)'},{transform:'rotate(-19deg)'}],900,'rotate(-19deg)','ease-in-out');
 // preview plays on the left
 imgs[i].classList.add('on');cap.querySelector('h3').textContent=t;cap.querySelector('p').textContent=q;cap.querySelector('.ds').textContent=d;cap.classList.add('on');
 setTimeout(()=>cap.classList.add('more'),3000);
 await run(arm,[{transform:'rotate(-19deg)'},{transform:'rotate(-38deg)'}],6500,'rotate(-38deg)','linear');
 // fade out, lift the needle, slow down
 imgs[i].classList.remove('on');cap.classList.remove('on','more');
 await run(arm,[{transform:'rotate(-38deg)'},{transform:'rotate(0)'}],900,'rotate(0)','ease-in-out');
 for(let r=1;r>.1;r-=.15){spin.playbackRate=r;await sleep(90)}spin.cancel();led.classList.remove('on');
 await sleep(500);
 // back into its sleeve
 await run(rec,[{transform:tf(650,250,1,0)},{transform:tf((x+650)/2,330,.6,-100),offset:.4},{transform:tf(x,440,.21,-300),offset:.8},{transform:tf(x,525,.21,-360)}],1300,tf(x,525,.21,0));
 rec.style.opacity=0;sv.style.transform='';await sleep(600)}
function fit(){$('st').style.zoom=Math.min(1,(innerWidth-20)/900)}addEventListener('resize',fit);fit();
if(matchMedia('(prefers-reduced-motion:reduce)').matches){imgs[0].classList.add('on');imgs[0].style.transition='none';cap.classList.add('on');cap.querySelector('h3').textContent=P[0][1];cap.querySelector('p').textContent=P[0][2];cap.querySelector('.ds').textContent=P[0][4];cap.classList.add('more');rec.style.opacity=1;rec.style.transform=tf(650,250,1,0);arm.style.transform='rotate(-26deg)'}
else(async()=>{for(let i=0;;i=(i+1)%6)await track(i)})();
</script></html>
